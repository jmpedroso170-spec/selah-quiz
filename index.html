 const avg=Math.round(s.players.reduce((t,p)=>t+hits(p),0)/n/s.qs.length*100);
 h+=`<div class="card"><h3>Retorno da turma</h3><p>Média de acertos: <b>${avg}%</b> · ${n} aluno(s)</p>
 <div class="fb">${weak.length?`<b>Precisa reforçar:</b><br>`+weak.map(x=>`P${x[1]+1} (${x[0]}%): ${esc(s.qs[x[1]].q)}<br><span class="hint">Resposta certa: ${esc(s.qs[x[1]].t)}</span>`).join("<br>"):"<b>Ótimo resultado.</b> A turma acertou bem todos os pontos da lição."}</div></div>
 <div class="card"><h3>Acertos por pergunta</h3>${pc.map((v,k)=>`<div class="rep"><b>P${k+1}</b><div class="t"><i style="width:${v}%;background:${v<50?"var(--bad)":v<75?"var(--gold)":"var(--ok)"}"></i></div><span>${v}%</span></div>`).join("")}</div>
 <div class="card"><h3>Retorno por aluno</h3>${[...s.players].sort((a,b)=>b.score-a.score).map(p=>{const e=p.ans.map((a,k)=>a.ok?null:"P"+(k+1)).filter(Boolean),pt=hits(p)/s.qs.length;
  return `<div class="row"><span>${av(p.av,40)}</span><div class="nm">${esc(p.name)} <span class="hint">${hits(p)}/${s.qs.length} · ${p.score} pts</span><div class="hint">${pt>=.8?"Muito bem.":pt>=.6?"Bom. Revisar "+e.join(", ")+".":"Precisa rever a lição. Errou "+e.join(", ")+"."}</div></div></div>`}).join("")}</div>
 <div class="card"><h3>O que cada aluno marcou</h3><div class="scroll"><table><tr><th>Aluno</th>${s.qs.map((_,k)=>`<th>P${k+1}</th>`).join("")}</tr>
 ${s.players.map(p=>`<tr><td>${esc(p.name)}</td>${p.ans.map(a=>`<td><span class="c" style="background:${a.c===null?"#888":a.ok?"var(--ok)":"var(--bad)"}">${a.c===null?"–":L[a.c]}</span></td>`).join("")}</tr>`).join("")}</table></div></div>`;
 return h+evo();
}
function evo(){
 const real=D.sessions.filter(s=>!s.demo),src=real.length?real:D.sessions;
 const ls=D.lessons.filter(l=>src.some(s=>s.lid===l.id)),nm={};
 src.forEach(s=>s.players.forEach(p=>{(nm[p.name]=nm[p.name]||{})[s.lid]=Math.round(hits(p)/s.qs.length*100)}));
 const names=Object.keys(nm);if(!names.length)return"";
 return `<div class="card"><h3>Evolução por aluno</h3><p class="hint">% de acertos na última aplicação de cada lição${real.length?"":" (inclui demonstração)"}.</p><div class="scroll"><table><tr><th>Aluno</th>${ls.map(l=>`<th>${esc(l.title.split("·")[0])}</th>`).join("")}</tr>
 ${names.map(n=>`<tr><td>${esc(n)}</td>${ls.map(l=>{const v=nm[n][l.id];return `<td>${v==null?"–":`<b style="color:${v<60?"var(--bad)":v>=80?"var(--ok)":"var(--ink)"}">${v}%</b>`}</td>`}).join("")}</tr>`).join("")}</table></div></div>`;
}

const rw=(p,i)=>`<div class="row"><span>${i+1}º</span>${av(p.av,40)}<span class="nm">${esc(p.name)}</span><b>${p.score}</b></div>`;
const pod=b=>{const r=b,pd=[r[1],r[0],r[2]],h=[110,150,85];return `<div class="card"><h2 style="text-align:center">Pódio final</h2><div class="podium">${pd.map((p,i)=>p?`<div style="height:${h[i]+50}px">${av(p.av,56)}<small>${esc(p.name)}</small>${p.score}</div>`:"").join("")}</div>${r.map(rw).join("")}</div>`};
function setAv(k,i){D.me.av[k]=i;save();draw()}
function go(t){V.tab=t;draw();scrollTo(0,0)}
function pickRole(r){V.role=r;V.ph="pin";draw()}
function draw(){
 $("nav").style.display=V.role==="t"&&V.user?"flex":"none";
 ["room","edit","rep"].forEach(x=>$("n-"+x).classList.toggle("on",V.tab===x));
 $("app").innerHTML=!V.role?vHome():V.role==="s"?vStu():!V.user?vLogin():V.tab==="edit"?vEdit():V.tab==="rep"?(D.lessons.length?vRep():'<div class="card">Crie uma lição primeiro.</div>'):vRoom();
}
const vHome=()=>`<div class="card tip">${mascot(70)}<p><b>Oi, eu sou o Pomi!</b> Bem-vindo ao Selah Quiz. Quem é você hoje?</p></div><button class="big" onclick="pickRole('s')">Sou aluno</button><button class="big ghost" onclick="pickRole('t')">Sou professor</button>`;
const vLogin=()=>`<div class="card"><h2>Entrar como professor</h2><label>E-mail<input id="em" type="email" value="${TEACHER}"></label><label>Senha<input id="pw" type="password"></label><button class="big" onclick="login()">Entrar</button><p id="er" class="hint"></p><button class="ghost sm" onclick="pickRole(null)">Voltar</button></div>`;
async function login(){try{await signInWithEmailAndPassword(auth,$("em").value.trim(),$("pw").value)}catch(e){$("er").textContent="E-mail ou senha incorretos."}}
async function logout(){await signOut(auth);location.reload()}
let started=false;
onAuthStateChanged(auth,u=>{V.user=u&&u.email===TEACHER?u:null;
 if(V.user&&!started){started=true;
  onSnapshot(collection(db,"lessons"),s=>{D.lessons=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.title.localeCompare(b.title));draw()});
  onSnapshot(query(collection(db,"sessions"),orderBy("date")),s=>{D.sessions=s.docs.map(d=>d.data());draw()})}
 draw()});
/* ---------- lições ---------- */
const lref=()=>doc(db,"lessons",D.lessons[V.el].id);
function vEdit(){
 const ls=D.lessons;if(V.el>=ls.length)V.el=0;const l=ls[V.el];
 const h=`<div class="card"><h2>Lições</h2>${ls.length?`<div class="pills">${ls.map((x,i)=>`<button class="${i===V.el?"on":""}" onclick="V.el=${i};draw()">${esc(x.title)}</button>`).join("")}</div>`:`<p>Nenhuma lição ainda.</p><button class="ghost sm" onclick="seed()">Carregar Lição 5 (exemplo)</button>`}
 <input id="nl" placeholder="Ex.: Lição 6 · O significado do batismo"><button class="ghost sm" onclick="addL()">Criar nova lição</button></div>`;
 if(!l)return h;
 return h+`<div class="card"><div class="qi"><h3>${esc(l.title)}</h3><button class="sm danger" onclick="delL()">Apagar lição</button></div><p class="hint">${l.qs.length} perguntas</p>
 ${l.qs.map((q,i)=>`<div class="row qi"><div><b>${i+1}.</b> ${esc(q.q)}<div class="hint">Certa: ${esc(q.o[q.a])}</div></div><button class="sm danger" onclick="delQ(${i})" aria-label="Apagar pergunta ${i+1}">Apagar</button></div>`).join("")}</div>
 <div class="card"><h3>Nova pergunta</h3><input id="eq" placeholder="Digite a pergunta">${[0,1,2,3].map(i=>`<input id="eo${i}" placeholder="Alternativa ${L[i]}">`).join("")}
 <label>Resposta certa<select id="ea">${[0,1,2,3].map(i=>`<option value="${i}">${L[i]}</option>`).join("")}</select></label>
 <button class="big" onclick="addQ()">Adicionar pergunta</button><p id="em2" class="hint"></p></div>`;
}
async function addL(){const t=$("nl").value.trim();if(t)await addDoc(collection(db,"lessons"),{title:t,qs:[]})}
async function delL(){if(confirm("Apagar esta lição? Os relatórios já feitos continuam salvos.")){const id=D.lessons[V.el].id;V.el=0;await deleteDoc(doc(db,"lessons",id))}}
async function addQ(){const q=$("eq").value.trim(),o=[0,1,2,3].map(i=>$("eo"+i).value.trim());if(!q||o.some(x=>!x)){$("em2").textContent="Preencha a pergunta e as quatro alternativas.";return}await updateDoc(lref(),{qs:[...D.lessons[V.el].qs,{q,o,a:+$("ea").value}]})}
async function delQ(i){await updateDoc(lref(),{qs:D.lessons[V.el].qs.filter((_,k)=>k!==i)})}
async function seed(){const{id,...x}=L5;await setDoc(doc(db,"lessons","l5"),x)}
/* ---------- sala do professor ---------- */
const rref=()=>doc(db,"rooms",V.pin);
async function openRoom(){
 const l=D.lessons.find(x=>x.id===$("ls").value);if(!l||!l.qs.length){alert("Escolha uma lição com perguntas.");return}
 const pin=String(100000+Math.floor(Math.random()*900000));
 await setDoc(doc(db,"rooms",pin),{title:l.title,qs:l.qs.map(q=>({q:q.q,o:q.o})),state:"lobby",qi:0,reveals:{},board:[]});
 await setDoc(doc(db,"rooms",pin,"secret","key"),{ans:l.qs.map(q=>q.a)});
 V.pin=pin;V.lesson=l;V.room={state:"lobby",qi:0,reveals:{},board:[]};V.pl=[];
 V.u1=onSnapshot(rref(),s=>{if(s.data())V.room=s.data();draw()});
 V.u2=onSnapshot(collection(db,"rooms",pin,"players"),s=>{V.pl=s.docs.map(d=>({id:d.id,...d.data()}));
  const r=V.room;if(r.state==="q"&&V.pl.length&&V.pl.every(p=>p.ans&&p.ans[r.qi]))closeQ(r.qi);draw()});
 draw();
}
function scores(){return V.pl.map(p=>{let s=0;const ans=V.lesson.qs.map((q,i)=>{const r=p.ans&&p.ans[i],c=r?r.c:null,pp=r?pts(c,q.a,r.t):0;s+=pp;return{c,ok:c===q.a,pts:pp}});return{name:p.name,av:p.av,score:s,ans}}).sort((a,b)=>b.score-a.score)}
async function startQ(i){await updateDoc(rref(),{state:"q",qi:i});clearTimeout(V.qt);V.qt=setTimeout(()=>closeQ(i),(T+3)*1000)}
async function closeQ(i){clearTimeout(V.qt);if(V.room.state!=="q"||V.room.qi!==i)return;V.room.state="result";
 await updateDoc(rref(),{state:"result",["reveals."+i]:V.lesson.qs[i].a,board:scores().slice(0,5).map(p=>({name:p.name,av:p.av,score:p.score}))})}
async function nextQ(){const i=V.room.qi+1;if(i<V.lesson.qs.length)startQ(i);else finish()}
async function finish(){const sc=scores();
 await updateDoc(rref(),{state:"end",board:sc.map(p=>({name:p.name,av:p.av,score:p.score}))});
 await addDoc(collection(db,"sessions"),{lid:V.lesson.id,date:new Date().toISOString(),demo:false,qs:V.lesson.qs.map(q=>({q:q.q,o:q.o,t:q.o[q.a],a:q.a})),players:sc})}
async function closeRoom(){V.u1&&V.u1();V.u2&&V.u2();const p=V.pin;V.pin=null;draw();try{await deleteDoc(doc(db,"rooms",p,"secret","key"));await deleteDoc(doc(db,"rooms",p))}catch(e){}}
function vRoom(){
 if(!V.pin)return `<div class="card"><h2>Abrir sala</h2>${D.lessons.length?`<select id="ls">${D.lessons.map(l=>`<option value="${l.id}">${esc(l.title)} (${l.qs.length})</option>`).join("")}</select><button class="big" onclick="openRoom()">Abrir sala com PIN</button>`:"<p>Crie uma lição primeiro na aba Lições.</p>"}</div>`;
 const r=V.room,q=V.lesson.qs[r.qi||0],n=V.pl.length;
 if(r.state==="lobby")return `<div class="card" style="text-align:center"><p class="hint">Alunos: abram este site, toquem em “Sou aluno” e digitem o PIN</p><div class="pin">${V.pin}</div><h3>${esc(V.lesson.title)}</h3></div>
 <div class="card"><h3>${n} na sala</h3><div class="grid">${V.pl.map(p=>`<div class="pl">${av(p.av,52)}<br>${esc(p.name)}</div>`).join("")||'<span class="hint">Aguardando alunos…</span>'}</div></div>
 <button class="big" onclick="startQ(0)" ${n?"":"disabled"}>Iniciar quiz</button><button class="big ghost" onclick="closeRoom()">Cancelar sala</button>`;
 if(r.state==="q"){const k=V.pl.filter(p=>p.ans&&p.ans[r.qi]).length;
  return `<div class="hint">Pergunta ${r.qi+1} de ${V.lesson.qs.length}</div><div class="card"><h2>${esc(q.q)}</h2></div>
  <div class="opts">${q.o.map((o,i)=>`<div class="opt o${i}"><b>${L[i]}</b>${esc(o)}</div>`).join("")}</div>
  <div class="card" style="margin-top:14px;text-align:center"><div class="big-n">${k}/${n}</div>responderam</div><button class="big" onclick="closeQ(${r.qi})">Encerrar pergunta</button>`}
 if(r.state==="result"){const cnt=[0,1,2,3].map(i=>V.pl.filter(p=>p.ans&&p.ans[r.qi]&&p.ans[r.qi].c===i).length);
  return `<div class="card"><h2>${esc(q.q)}</h2></div><div class="opts">${q.o.map((o,i)=>`<div class="opt o${i} ${i===q.a?"right":"dim"}"><b>${L[i]}</b>${esc(o)}<span style="margin-left:auto">${cnt[i]}</span></div>`).join("")}</div>
  <div class="card" style="margin-top:14px"><h3>Placar</h3>${(r.board||[]).map(rw).join("")}</div><button class="big" onclick="nextQ()">${r.qi+1<V.lesson.qs.length?"Próxima pergunta":"Ver pódio final"}</button>`}
 return pod(r.board||[])+`<button class="big" onclick="closeRoom();go('rep')">Ver relatório da aula</button><button class="big ghost" onclick="closeRoom()">Fechar sala</button>`;
}
/* ---------- aluno ---------- */
function setPin(){const v=$("pin").value.trim();if(v.length<6){alert("Digite os 6 números do PIN.");return}V.spin=v;V.ph="avatar";draw()}
async function joinRoom(){
 if(!D.me.name.trim()){alert("Digite seu nome.");return}
 try{if(!auth.currentUser||auth.currentUser.email)await signInAnonymously(auth);
  const uid=auth.currentUser.uid,snap=await getDoc(doc(db,"rooms",V.spin));
  if(!snap.exists()){alert("PIN não encontrado. Confira com o professor.");V.ph="pin";draw();return}
  await setDoc(doc(db,"rooms",V.spin,"players",uid),{name:D.me.name.trim(),av:D.me.av,ans:{}});
  V.uid=uid;V.room=snap.data();V.ph="play";
  onSnapshot(doc(db,"rooms",V.spin),s=>{const r=s.data();if(!r)return;
   if(r.state==="q"&&(V.room.state!=="q"||V.room.qi!==r.qi)){V.t0=Date.now();V.sel=null;tick()}
   V.room=r;draw()});
  draw()}catch(e){alert("Não foi possível entrar. Confira o PIN e a internet.")}}
function tick(){clearInterval(V.tk);V.tk=setInterval(()=>{const e=(Date.now()-V.t0)/1000,b=$("tb");if(b)b.style.width=Math.max(0,100-e/T*100)+"%";if(V.room.state!=="q")clearInterval(V.tk)},200)}
async function ans(i){if(V.sel!=null)return;const qi=V.room.qi,t=Math.min(T,(Date.now()-V.t0)/1000);V.sel=i;V.my[qi]={c:i,t};draw();
 try{await updateDoc(doc(db,"rooms",V.spin,"players",V.uid),{["ans."+qi]:{c:i,t}})}catch(e){}}
function vStu(){
 if(V.ph==="pin")return `<div class="card"><h2>Entrar na sala</h2><p class="hint">Digite o PIN que o professor mostrou.</p><input id="pin" class="pin" inputmode="numeric" maxlength="6" placeholder="000000" value="${esc(V.spin)}"><button class="big" onclick="setPin()">Continuar</button><button class="ghost sm" onclick="pickRole(null)">Voltar</button></div>`;
 if(V.ph==="avatar")return vAvatar();
 const r=V.room,rv=r.reveals||{};
 if(r.state==="lobby")return `<div class="card tip">${av(D.me.av,84)}<p><b>${esc(D.me.name)}</b>, você está dentro! Aguarde o professor iniciar.</p></div>`;
 const i=r.qi,q=r.qs[i];
 if(r.state==="q")return V.sel!=null?`<div class="card" style="text-align:center">${mascot(80)}<div class="big-n">Resposta enviada!</div><p>Aguarde os colegas…</p></div>`
  :`<div class="hint">Pergunta ${i+1} de ${r.qs.length}</div><div class="bar"><i id="tb"></i></div><div class="card"><h2>${esc(q.q)}</h2></div><div class="opts">${q.o.map((o,k)=>`<button class="opt o${k}" onclick="ans(${k})"><b>${L[k]}</b>${esc(o)}</button>`).join("")}</div>`;
 if(r.state==="result"){const a=rv[i],m=V.my[i],ok=m&&m.c===a,p=m?pts(m.c,a,m.t):0,tot=Object.keys(V.my).reduce((s,k)=>s+(rv[k]!=null?pts(V.my[k].c,rv[k],V.my[k].t):0),0);
  return `<div class="card" style="text-align:center"><div class="big-n ${ok?"good":"badc"}">${!m?"Tempo esgotado":ok?"Acertou!":"Errou"}</div><div>+${p} pontos · total ${tot}</div></div>
  <div class="opts">${q.o.map((o,k)=>`<div class="opt o${k} ${k===a?"right":"dim"}"><b>${L[k]}</b>${esc(o)}</div>`).join("")}</div>
  <div class="card" style="margin-top:14px"><h3>Placar</h3>${(r.board||[]).map(rw).join("")}</div><p class="hint">Aguarde o professor…</p>`}
 const b=r.board||[],pos=b.findIndex(p=>p.name===D.me.name.trim());
 return `<div class="card" style="text-align:center"><h2>${pos>=0?"Você ficou em "+(pos+1)+"º lugar!":"Fim do quiz!"}</h2></div>`+pod(b);
}
Object.assign(window,{D,V,draw,save,rndAv,setAv,go,pickRole,login,logout,addL,delL,addQ,delQ,seed,openRoom,startQ,closeQ,nextQ,finish,closeRoom,setPin,joinRoom,ans});
$("mas").innerHTML=mascot(58);
draw();
</script></body></html>
